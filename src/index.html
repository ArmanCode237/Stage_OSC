<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stage OSC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Barra Superior Principal -->
  <header id="topbar">
    <div class="topbar-left">
      <div class="brand">STAGE<span>OSC</span></div>
      <div id="tx-monitor" title="Último mensaje enviado">
        <span id="tx-led"></span>
        <span id="tx-text">Listo</span>
      </div>
      <div class="scene-box">
        <select id="scene-select" title="Cambiar Escena"></select>
        <button id="btn-scenes-modal" class="btn-top">Escenas</button>
      </div>
    </div>

    <!-- Navegación rápida de Páginas dentro de la Escena -->
    <div class="topbar-pages">
      <button id="btn-prev-page" class="btn-page-nav" title="Página anterior">◀</button>
      <div id="page-tabs"></div>
      <button id="btn-add-page" class="btn-page-add" title="Añadir nueva página a esta escena">+ Pág</button>
      <button id="btn-next-page" class="btn-page-nav" title="Página siguiente">▶</button>
    </div>

    <div class="topbar-right">
      <button id="btn-panic" class="btn-top btn-danger" title="Apagar todas las notas activas">Panic</button>
      <button id="btn-net-modal" class="btn-top">Red IP</button>
      <button id="btn-toggle-edit" class="btn-top btn-accent">Editar UI</button>
      <button id="btn-fullscreen" class="btn-top" title="Pantalla completa">⛶</button>
    </div>
  </header>

  <!-- Barra Secundaria (Visible solo en Modo Edición) -->
  <div id="edit-toolbar" class="hidden">
    <div class="toolbar-group">
      <span class="toolbar-label">Añadir Control:</span>
      <button id="btn-add-fader" class="btn-tool">+ Fader Vertical</button>
      <button id="btn-add-knob" class="btn-tool">+ Knob Rotativo</button>
      <button id="btn-add-toggle" class="btn-tool">+ Botón Toggle</button>
      <button id="btn-add-pad" class="btn-tool">+ Botón / Pad</button>
    </div>
    <div class="toolbar-group">
      <span class="toolbar-label">Página Actual:</span>
      <button id="btn-rename-page" class="btn-tool">Renombrar Pág</button>
      <button id="btn-dup-page" class="btn-tool">Duplicar Pág</button>
      <button id="btn-del-page" class="btn-tool btn-danger-soft">Borrar Pág</button>
      <label class="snap-toggle">
        <input type="checkbox" id="chk-snap" checked /> Imán (20px)
      </label>
    </div>
  </div>

  <!-- Área Principal (Lienzo 100% libre en Modo Edición) -->
  <main id="workspace">
    <div id="canvas-area"></div>
  </main>

  <!-- Modal de Configuración de Control (Estilo Swal Alert) -->
  <div id="modal-widget-config" class="modal-backdrop hidden">
    <div class="modal-card modal-wide">
      <div class="modal-header-flex">
        <h3 id="widget-config-title">Configurar Control</h3>
        <div class="row-gap">
          <button id="btn-dup-widget-modal" class="btn-top">Duplicar</button>
          <button id="btn-del-widget-modal" class="btn-top btn-danger">Eliminar</button>
        </div>
      </div>

      <div class="inspector-body">
        <section class="insp-section">
          <h4>General</h4>
          <div class="row-2col">
            <label>Nombre / Etiqueta
              <input type="text" id="inp-label" maxlength="24" />
            </label>
            <label>Tipo de Elemento
              <select id="inp-type">
                <option value="fader">Fader Vertical</option>
                <option value="knob">Knob Rotativo</option>
                <option value="toggle">Botón Toggle (Interruptor ON/OFF)</option>
                <option value="pad">Botón / Pad (Disparo)</option>
              </select>
            </label>
          </div>
          <div id="group-toggle-texts" class="row-2col hidden">
            <label>Texto ON <input type="text" id="inp-on-label" maxlength="12" /></label>
            <label>Texto OFF <input type="text" id="inp-off-label" maxlength="12" /></label>
          </div>
        </section>

        <section class="insp-section">
          <h4>Mensaje MIDI / OSC</h4>
          <div class="row-2col">
            <label>Tipo de Mensaje
              <select id="inp-msg-type">
                <option value="cc">MIDI CC (Control Change 0–127)</option>
                <option value="note">Nota MIDI (0–127)</option>
                <option value="program">Program Change (0–127)</option>
                <option value="pitch">Pitch Bend (0–16383)</option>
                <option value="osc">Ruta OSC Personalizada</option>
              </select>
            </label>
            <div id="group-midi-ch">
              <label>Canal MIDI
                <select id="inp-channel"></select>
              </label>
            </div>
          </div>

          <div id="group-midi-num">
            <label><span id="lbl-midi-num">Número CC (0–127)</span>
              <div class="dual-input">
                <input type="number" id="inp-midi-num" min="0" max="127" />
                <select id="inp-midi-preset"></select>
              </div>
            </label>
          </div>

          <div id="group-note-mode" class="hidden">
            <label>Comportamiento de Nota
              <select id="inp-note-behavior">
                <option value="latch">Continuo / Latch (0 = Off, 1–127 = Velocidad)</option>
                <option value="gate">Gate Táctil (Note Off al levantar dedo)</option>
                <option value="sweep">Barrido / Glissando (Rango Mín a Máx)</option>
              </select>
            </label>
          </div>

          <div id="group-osc-path" class="hidden">
            <div class="row-2col">
              <label>Dirección OSC <input type="text" id="inp-osc-address" placeholder="/track/1/volume" /></label>
              <label>Formato Dato
                <select id="inp-osc-type">
                  <option value="f">Decimal (Float 0.0 – 1.0)</option>
                  <option value="i">Entero (Int Mín – Máx)</option>
                </select>
              </label>
            </div>
          </div>

          <div class="row-2col" id="group-minmax">
            <label><span id="lbl-min-val">Valor Mín</span> <input type="number" id="inp-min" min="0" max="16383" /></label>
            <label><span id="lbl-max-val">Valor Máx</span> <input type="number" id="inp-max" min="0" max="16383" /></label>
          </div>
        </section>

        <section class="insp-section">
          <h4>Color, Efectos y Tamaño</h4>
          <div class="row-2col">
            <label>Color del Control
              <div class="color-row">
                <input type="color" id="inp-color" />
                <div id="color-swatches"></div>
              </div>
            </label>
            <label>Efecto Luminoso
              <select id="inp-glow">
                <option value="none">Sin brillo</option>
                <option value="soft">Brillo suave</option>
                <option value="neon">Neón intenso</option>
              </select>
            </label>
          </div>

          <div class="row-2col">
            <label>Estilo de Superficie
              <select id="inp-style">
                <option value="glass">Cristal Oscuro (Glass)</option>
                <option value="solid">Sólido Mate</option>
                <option value="outline">Borde Resaltado</option>
                <option value="minimal">Minimalista Transparente</option>
              </select>
            </label>
            <div class="checks-col">
              <label id="row-show-ticks" class="check-row"><input type="checkbox" id="inp-show-ticks" /> Escala graduada</label>
              <label class="check-row"><input type="checkbox" id="inp-show-value" /> Indicador numérico</label>
              <label id="row-spring" class="check-row"><input type="checkbox" id="inp-spring" /> Retorno automático</label>
            </div>
          </div>

          <div class="row-4col">
            <label>X <input type="number" id="inp-x" /></label>
            <label>Y <input type="number" id="inp-y" /></label>
            <label>Ancho <input type="number" id="inp-w" min="60" /></label>
            <label>Alto <input type="number" id="inp-h" min="60" /></label>
          </div>
        </section>
      </div>

      <div class="modal-footer">
        <span></span>
        <button id="btn-close-widget-modal" class="btn-top btn-accent">Guardar y Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal de Red / IP -->
  <div id="modal-network" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Conexión OSC por IP hacia REAPER</h3>
      <label>IP de la Laptop con REAPER
        <input type="text" id="net-host" placeholder="Ej. 192.168.1.50" />
      </label>
      <label>Puerto OSC Local en REAPER
        <input type="number" id="net-port" placeholder="8000" />
      </label>
      <div class="info-box">
        <br>
        <strong>IPs detectadas en este equipo:</strong>
        <div id="local-ips-list">Detectando...</div>
      </div>
      <div class="modal-footer">
        <button id="btn-test-osc" class="btn-tool">Enviar Prueba (CC 1)</button>
        <div>
          <button id="btn-close-net" class="btn-top">Cancelar</button>
          <button id="btn-save-net" class="btn-top btn-accent">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Gestor de Escenas -->
  <div id="modal-scenes" class="modal-backdrop hidden">
    <div class="modal-card modal-wide">
      <h3>Gestor de Escenas</h3>
      <div id="scenes-list" class="scenes-list"></div>
      <div class="modal-footer">
        <div class="row-gap">
          <button id="btn-new-scene" class="btn-top btn-accent">+ Nueva Escena</button>
          <button id="btn-import-json" class="btn-tool">Importar JSON</button>
          <button id="btn-export-json" class="btn-tool">Exportar Backup</button>
        </div>
        <button id="btn-close-scenes" class="btn-top">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Táctil para Textos -->
  <div id="modal-dialog" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="dialog-title">Título</h3>
      <input type="text" id="dialog-input" class="hidden" />
      <p id="dialog-message" class="hidden"></p>
      <div class="modal-footer">
        <span></span>
        <div class="row-gap">
          <button id="dialog-cancel" class="btn-top">Cancelar</button>
          <button id="dialog-ok" class="btn-top btn-accent">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Menú Contextual Flotante (Clic Derecho en Modo Edición) -->
  <div id="context-menu" class="context-menu hidden">
    <button id="ctx-btn-config" class="ctx-item">
      <span class="ctx-icon">⚙</span> Configurar
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
